[package]
name = "retifs-cloudfiles"
version = "0.0.1"
description = "retifs-cloudfiles: a namespace as a Windows Cloud Files sync root in Explorer (ADR-0002), prototype"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "retifs-cloudfiles"
path = "src/main.rs"

[dependencies]
libretifs = { path = "../libretifs" }
retifs-tree = { path = "../retifs-tree" }
tokio = { version = "1", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
cloud-filter = "0.0.6"
nt-time = "0.8"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
