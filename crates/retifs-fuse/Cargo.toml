[package]
name = "retifs-fuse"
version = "0.0.1"
description = "retifs-mount: a namespace as a FUSE file tree (ADR-0002), prototype"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "retifs-mount"
path = "src/main.rs"

[dependencies]
libretifs = { path = "../libretifs" }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.15", default-features = false, features = ["abi-7-9"] }
libc = "0.2"
