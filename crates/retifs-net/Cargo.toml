[package]
name = "retifs-net"
version = "0.0.1"
description = "retifs networking over Reticulum via Prns (prototype, unstable)"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
hex = "0.4"
personal-rns = { path = "../../../Prns-0.3.8/personal-rns", features = ["tokio-host", "tcp", "shared-instance"] }
retifs-core = { path = "../retifs-core" }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
