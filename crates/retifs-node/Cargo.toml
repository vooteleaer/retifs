[package]
name = "retifs-node"
version = "0.0.1"
description = "retifsd and the retifs CLI (prototype, unstable)"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "retifsd"
path = "src/bin/retifsd.rs"

[[bin]]
name = "retifs"
path = "src/bin/retifs.rs"

[dependencies]
getrandom = "0.3"
libretifs = { path = "../libretifs" }
redb = "2"
rmp-serde = "1"
personal-rns = { version = "=0.3.7", features = ["tokio-host", "tcp", "shared-instance"] }
retifs-core = { path = "../retifs-core" }
retifs-net = { path = "../retifs-net" }
retifs-store = { path = "../retifs-store" }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
