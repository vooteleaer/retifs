[package]
name = "retifs-node"
version = "0.0.1"
description = "retifsd and the retifs CLI (prototype, unstable)"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "retifsd"
path = "src/bin/retifsd.rs"

[[bin]]
name = "retifs"
path = "src/bin/retifs.rs"

[dependencies]
getrandom = "0.3"
libretifs = { path = "../libretifs" }
qrcode = { version = "0.14", default-features = false }
toml = "0.8"
redb = "2"
rmp-serde = "1"
personal-rns = { path = "../../../Prns-0.3.8/personal-rns", features = ["tokio-host", "tcp", "shared-instance"] }
retifs-core = { path = "../retifs-core" }
retifs-net = { path = "../retifs-net" }
retifs-store = { path = "../retifs-store" }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }
