[package]
name = "libretifs"
version = "0.0.1"
description = "Client library for the retifs local API (ADR-0004), prototype"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros"] }
