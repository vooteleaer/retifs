[package]
name = "retifs-core"
version = "0.0.1"
description = "retifs core: chunk encryption, CIDs, chunking (prototype, unstable)"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
curve25519-dalek = "4"
ed25519-dalek = "2"
fastcdc = "3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
